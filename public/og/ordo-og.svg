<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="24" fill="#0f172a" />
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="url(#g1)" opacity="0.12" />

  <!-- Main card -->
  <g transform="translate(60,60)">
    <rect width="1080" height="510" rx="16" fill="#0b1220" opacity="0.85" filter="url(#f1)" />

    <!-- Left text -->
    <g transform="translate(60,80)">
      <text x="0" y="0" font-family="Hanken Grotesk, Arial, sans-serif" font-weight="800" font-size="48" fill="#ffffff">Ordo</text>
      <text x="0" y="70" font-family="Hanken Grotesk, Arial, sans-serif" font-weight="700" font-size="28" fill="#e6eef7">Gestión de Citas Inteligente</text>

      <text x="0" y="140" font-family="Hanken Grotesk, Arial, sans-serif" font-weight="500" font-size="20" fill="#cfe9f4">Agenda, clientes y servicios en una sola plataforma.</text>

      <rect x="0" y="180" width="220" height="48" rx="10" fill="#7c3aed" />
      <text x="110" y="214" font-family="Hanken Grotesk, Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">Solicitar Demo</text>
    </g>

    <!-- Right mockup box -->
    <g transform="translate(700,80)">
      <rect width="320" height="200" rx="10" fill="#fff" />
      <rect x="12" y="12" width="296" height="176" rx="8" fill="#0f172a" opacity="0.06" />
      <text x="160" y="110" font-family="Hanken Grotesk, Arial, sans-serif" font-weight="600" font-size="18" fill="#0b1220" text-anchor="middle">Mockup</text>
    </g>
  </g>

  <!-- Footer small text -->
  <text x="60" y="600" font-family="Hanken Grotesk, Arial, sans-serif" font-size="14" fill="#9fb4c9">softexlabs - ordo</text>
</svg>
